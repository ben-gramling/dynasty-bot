# Collector pipeline (tomato scrapers.yml shape, single Lambda): build the
# function zip + deps layer, upload to S3, then terraform-apply the
# collector stack. Push-to-main only, path-filtered.
#
# Required repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# TF_API_TOKEN.

name: Collector

on:
  push:
    branches: [main]
    paths:
      - "apps/collector/**"
      - "libs/core/**" # the layer bundles the core wheel + its deps
      - "infra/stacks/collector/**"
      # The collector stack instantiates both local modules; shared-infra.yml
      # watches infra/modules/** too, but it applies the *shared* stack — the
      # collector stack must re-plan itself when a module changes.
      - "infra/modules/**"
      - "scripts/build_lambda_artifacts.sh"

jobs:
  deploy-lambda:
    uses: ./.github/workflows/deploy-lambda.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # Upload-before-apply (kept from tomato): Terraform reads the zips' S3
  # ETags as source_code_hash at plan time, so the apply only ships new code
  # if the upload landed first.
  deploy-infra:
    needs: [deploy-lambda]
    uses: ./.github/workflows/deploy-infra.yml
    with:
      stack: collector
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
