[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pymongo[aws]",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
